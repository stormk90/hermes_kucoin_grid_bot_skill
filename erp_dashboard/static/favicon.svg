<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#0d419d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Cuadrado Suavizado -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#388bfd" stroke-width="2" />

  <!-- Antena -->
  <circle cx="32" cy="14" r="3.5" fill="#f0f6fc" stroke="#0d419d" stroke-width="1.5" />
  <line x1="32" y1="17.5" x2="32" y2="25" stroke="#f0f6fc" stroke-width="3" stroke-linecap="round" />

  <!-- Cabeza del Bot -->
  <rect x="14" y="25" width="36" height="27" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="2.5" />

  <!-- Orejas / Conectores Laterales -->
  <rect x="10" y="32" width="4" height="13" rx="2" fill="#388bfd" />
  <rect x="50" y="32" width="4" height="13" rx="2" fill="#388bfd" />

  <!-- Ojos Brillantes Cyan Neón -->
  <circle cx="25" cy="37" r="4" fill="#58a6ff" filter="url(#glow)" />
  <circle cx="39" cy="37" r="4" fill="#58a6ff" filter="url(#glow)" />
  <!-- Pupila brillante -->
  <circle cx="26.2" cy="35.8" r="1.3" fill="#ffffff" />
  <circle cx="40.2" cy="35.8" r="1.3" fill="#ffffff" />

  <!-- Boca / Display de Grid -->
  <path d="M24 45.5h16" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" />
</svg>
